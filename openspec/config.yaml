schema: spec-driven

# Project context (optional)
context: |
  Fairy monorepo under Fairy/: apps/web (React), apps/api (Express), packages/shared, packages/ai-sdk, packages/database (Prisma).
  Spine: AGENTS.md, ARCHITECTURE.md, API_CONTRACT.md, PROJECT_STATUS.md.
  API envelope { code, data, msg }. Secrets via env only. Inventory mutations in Prisma transactions.
  Phase 2 chat is rule-only; do not call OpenAI/Claude in this change.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
